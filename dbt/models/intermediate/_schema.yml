version: 2

models:
  - name: dim_products
    description: Product dimension from the FakeStore catalog (intermediate / star-schema core).
    columns:
      - name: product_id
        description: Product primary key.
        data_tests:
          - not_null
          - unique

  - name: dim_users
    description: Current user dimension (one row per user_id where is_current).
    columns:
      - name: user_id
        description: Stable user business key.
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Current orders with user attributes valid on order_date (SCD2 as-of join).
    columns:
      - name: order_id
        description: Stable order business key.
        data_tests:
          - not_null
          - unique
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_users')
              field: user_id
      - name: order_date
        data_tests:
          - not_null

  - name: fct_order_items
    description: Current order line items linked to fct_orders.
    columns:
      - name: order_item_id
        description: Stable order_item business key.
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: line_total
        data_tests:
          - not_null
