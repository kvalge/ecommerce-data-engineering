services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/raw_schema.sql:/docker-entrypoint-initdb.d/01_raw_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    container_name: ecommerce_dbt
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
    env_file:
      - .env
    environment:
      DBT_PROFILES_DIR: /usr/app
      # Reach Postgres on the Compose network (not localhost / host port)
      DBT_HOST: postgres
      DBT_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dbt
    entrypoint: ["dbt"]

volumes:
  postgres_data:
